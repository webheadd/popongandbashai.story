<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An elegant interactive wedding invitation.">
  <title>S & R — Our Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/story.css">
  <link rel="stylesheet" href="css/details.css">
  <link rel="stylesheet" href="css/rsvp.css">
</head>
<body>
  <div class="site-background" aria-hidden="true">
    <div class="ornament ornament--one"></div>
    <div class="ornament ornament--two"></div>
    <div class="grain"></div>
  </div>

  <div class="site-shell">

    <main id="app" tabindex="-1"></main>

    <div id="musicPlayer" class="music-player" aria-label="Background music player">
      <button id="musicToggle" class="music-toggle" aria-label="Play music" aria-pressed="false">
        <span class="music-icon">♫</span>
      </button>
      <audio id="backgroundMusic" loop preload="metadata">
        <source src="assets/music/wedding-song.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
